[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-vehicle-safe-control"
version = "1.0.0"
description = "Safety-Critical Control (CLF-CBF-QP) and Trajectory Tracking (TV-LQR, CMPC) for Autonomous Vehicles"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Hrishikesh Gawade" }
]
keywords = [
    "autonomous-vehicles",
    "self-driving-cars",
    "control-barrier-functions",
    "control-lyapunov-functions",
    "model-predictive-control",
    "quadratic-programming",
    "lqr",
    "cvxpy"
]
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.9.0",
    "cvxpy>=1.3.0",
    "matplotlib>=3.5.0",
    "osqp>=0.6.2",
    "clarabel>=0.6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ipykernel>=6.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.pyright]
extraPaths = [".", "student", "controllers", "simulation"]
include = [".", "student", "controllers", "simulation", "tests", "notebooks"]

